name: Pages statiques (référencement)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Générer les pages
        run: node outils/generer-pages.mjs
      - name: Publier si changement
        run: |
          git config user.name "glossaire-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add concept concepts en es de pt it sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Pages statiques régénérées depuis la base"
          git push
