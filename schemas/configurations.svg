ext x="1532.0" y="302.7" font-size="15.5" font-weight="700" fill="#2e5f92" text-anchor="middle">culturelles</text><rect x="1426.0" y="316" width="212.0" height="44" rx="20" fill="#f6ead0" stroke="none" stroke-width="0"/><text x="1532.0" y="342.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Religieuses</text><rect x="1426.0" y="370" width="212.0" height="44" rx="20" fill="#f5dde8" stroke="none" stroke-width="0"/><text x="1532.0" y="396.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Culturelles-artistiques</text><rect x="1072" y="654" width="332.0" height="56" rx="28" fill="#ece8f6" stroke="#5b4a8c" stroke-width="1.5"/><text x="1238.0" y="686.9" font-size="14" font-weight="700" fill="#5b4a8c" text-anchor="middle">Autorité du droit</text><line x1="1152.0" y1="650" x2="1152.0" y2="632" stroke="#5b4a8c" stroke-width="2"/><polygon points="1146.0,634 1158.0,634 1152.0,624" fill="#5b4a8c"/><line x1="1324.0" y1="650" x2="1324.0" y2="632" stroke="#5b4a8c" stroke-width="2"/><polygon points="1318.0,634 1330.0,634 1324.0,624" fill="#5b4a8c"/><rect x="1416.0" y="654" width="112.0" height="56" rx="28" fill="#f6ead0" stroke="#8a5d0c" stroke-width="1.5"/><text x="1472.0" y="677.8" font-size="14" font-weight="700" fill="#8a5d0c" text-anchor="middle">Autorité</text><text x="1472.0" y="696.0" font-size="14" font-weight="700" fill="#8a5d0c" text-anchor="middle">du sacré</text><line x1="1474.0" y1="650" x2="1474.0" y2="632" stroke="#8a5d0c" stroke-width="2"/><polygon points="1468.0,634 1480.0,634 1474.0,624" fill="#8a5d0c"/><rect x="1536.0" y="654" width="112.0" height="56" rx="28" fill="#f5dde8" stroke="#a33a6b" stroke-width="1.5"/><text x="1592.0" y="677.8" font-size="14" font-weight="700" fill="#a33a6b" text-anchor="middle">Autorité de</text><text x="1592.0" y="696.0" font-size="14" font-weight="700" fill="#a33a6b" text-anchor="middle">l’œuvre d’art</text><line x1="1590.0" y1="650" x2="1590.0" y2="632" stroke="#a33a6b" stroke-width="2"/><polygon points="1584.0,634 1596.0,634 1590.0,624" fill="#a33a6b"/><text x="1360.0" y="738.0" font-size="15" font-weight="600" fill="#5b4a8c" text-anchor="middle" font-style="italic">Ordre symbolique</text><text x="40" y="738.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="start">D’après M. Zacklad, typologie des configurations institutionnelles (version 4.2)</text></svg>