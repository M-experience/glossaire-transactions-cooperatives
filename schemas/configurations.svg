<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 720" width="1700" height="720" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="1700" height="720" fill="#ffffff"/><text x="40" y="58.0" font-size="28" font-weight="700" fill="#1f2430" text-anchor="start">Configurations institutionnelles de l’action collective</text><text x="40" y="88.0" font-size="17" font-weight="400" fill="#55606e" text-anchor="start">Typologie en types idéaux</text><rect x="40" y="100" width="1620" height="26" rx="8" fill="#efece6" stroke="none" stroke-width="0"/><text x="850" y="117.9" font-size="14" font-weight="600" fill="#55606e" text-anchor="middle">Configuration institutionnelle : mode d’inscription des selfs dans l’action collective</text><rect x="40" y="130" width="420" height="452" rx="16" fill="#fbeeee" stroke="#b0413e" stroke-width="2"/><text x="250.0" y="167.3" font-size="21" font-weight="700" fill="#b0413e" text-anchor="middle">Configurations primaires</text><text x="250.0" y="196.5" font-size="13.5" font-weight="400" fill="#55606e" text-anchor="middle">Inscription des selfs dans leur continuité</text><text x="250.0" y="214.7" font-size="13.5" font-weight="400" fill="#55606e" text-anchor="middle">biographique et leur reproduction biologique ;</text><text x="250.0" y="232.9" font-size="13.5" font-weight="400" fill="#55606e" text-anchor="middle">le self est engagé en totalité, dans sa singularité</text><rect x="52" y="258" width="192.0" height="296" rx="12" fill="#ffffff" stroke="#b0413e" stroke-width="1.3"/><text x="148.0" y="293.4" font-size="15.5" font-weight="700" fill="#b0413e" text-anchor="middle">Domestiques</text><rect x="62" y="316" width="172.0" height="44" rx="20" fill="#f6dcdc" stroke="none" stroke-width="0"/><text x="148.0" y="342.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Conjugales</text><rect x="62" y="370" width="172.0" height="44" rx="20" fill="#f6dcdc" stroke="none" stroke-width="0"/><text x="148.0" y="396.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Familiales</text><rect x="256.0" y="258" width="192.0" height="296" rx="12" fill="#ffffff" stroke="#b0413e" stroke-width="1.3"/><text x="352.0" y="293.4" font-size="15.5" font-weight="700" fill="#b0413e" text-anchor="middle">Électives</text><rect x="266.0" y="316" width="172.0" height="44" rx="20" fill="#f6dcdc" stroke="none" stroke-width="0"/><text x="352.0" y="342.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Amitiés intimes</text><rect x="490" y="130" width="540" height="452" rx="16" fill="#f0f6e8" stroke="#4f7a28" stroke-width="2"/><text x="760.0" y="167.3" font-size="21" font-weight="700" fill="#4f7a28" text-anchor="middle">Configurations secondaires</text><text x="760.0" y="196.6" font-size="13.5" font-weight="400" fill="#55606e" text-anchor="middle">Appartenance du self à un collectif institué</text><text x="760.0" y="214.8" font-size="13.5" font-weight="400" fill="#55606e" text-anchor="middle">visant des finalités spécifiques</text><rect x="502" y="258" width="252.0" height="296" rx="12" fill="#ffffff" stroke="#4f7a28" stroke-width="1.3"/><text x="628.0" y="293.4" font-size="15.5" font-weight="700" fill="#4f7a28" text-anchor="middle">De sociabilité</text><rect x="512" y="316" width="232.0" height="44" rx="20" fill="#dcebc9" stroke="none" stroke-width="0"/><text x="628.0" y="342.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Foules et rassemblements</text><rect x="512" y="370" width="232.0" height="44" rx="20" fill="#dcebc9" stroke="none" stroke-width="0"/><text x="628.0" y="396.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Amicales et réticulaires</text><rect x="512" y="424" width="232.0" height="44" rx="20" fill="#dcebc9" stroke="none" stroke-width="0"/><text x="628.0" y="450.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Groupales</text><rect x="512" y="478" width="232.0" height="44" rx="20" fill="#dcebc9" stroke="none" stroke-width="0"/><text x="628.0" y="504.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Communautaires</text><rect x="766.0" y="258" width="252.0" height="296" rx="12" fill="#ffffff" stroke="#4f7a28" stroke-width="1.3"/><text x="892.0" y="284.1" font-size="15.5" font-weight="700" fill="#4f7a28" text-anchor="middle">Administratives</text><text x="892.0" y="302.7" font-size="15.5" font-weight="700" fill="#4f7a28" text-anchor="middle">et gestionnaires</text><rect x="776.0" y="316" width="232.0" height="44" rx="20" fill="#dcebc9" stroke="none" stroke-width="0"/><text x="892.0" y="342.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">De l’économie sociale</text><rect x="776.0" y="370" width="232.0" height="44" rx="20" fill="#dcebc9" stroke="none" stroke-width="0"/><text x="892.0" y="396.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Entrepreneuriales</text><rect x="776.0" y="424" width="232.0" height="44" rx="20" fill="#dcebc9" stroke="none" stroke-width="0"/><text x="892.0" y="450.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Publiques</text><rect x="1060" y="130" width="600" height="452" rx="16" fill="#edf3fb" stroke="#2e5f92" stroke-width="2"/><text x="1360.0" y="167.3" font-size="21" font-weight="700" fill="#2e5f92" text-anchor="middle">Configurations tertiaires</text><text x="1360.0" y="196.6" font-size="13.5" font-weight="400" fill="#55606e" text-anchor="middle">Inscription des selfs dans un ordre symbolique</text><text x="1360.0" y="214.8" font-size="13.5" font-weight="400" fill="#55606e" text-anchor="middle">relevant du droit, du sacré ou de l’œuvre d’art</text><rect x="1072" y="258" width="165.1764705882353" height="296" rx="12" fill="#ffffff" stroke="#2e5f92" stroke-width="1.3"/><text x="1154.5882352941176" y="293.4" font-size="15.5" font-weight="700" fill="#2e5f92" text-anchor="middle">Civiques</text><rect x="1082" y="316" width="145.1764705882353" height="44" rx="20" fill="#d6e5f6" stroke="none" stroke-width="0"/><text x="1154.5882352941176" y="342.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Politiques</text><rect x="1082" y="370" width="145.1764705882353" height="60" rx="20" fill="#d6e5f6" stroke="none" stroke-width="0"/><text x="1154.5882352941176" y="396.5" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Étatique et</text><text x="1154.5882352941176" y="413.3" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">administrative</text><rect x="1082" y="440" width="145.1764705882353" height="60" rx="20" fill="#d6e5f6" stroke="none" stroke-width="0"/><text x="1154.5882352941176" y="466.5" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Citoyenne et</text><text x="1154.5882352941176" y="483.3" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">participative</text><rect x="1249.1764705882354" y="258" width="146.11764705882354" height="296" rx="12" fill="#ffffff" stroke="#2e5f92" stroke-width="1.3"/><text x="1322.235294117647" y="284.1" font-size="15.5" font-weight="700" fill="#2e5f92" text-anchor="middle">Marchandes-</text><text x="1322.235294117647" y="302.7" font-size="15.5" font-weight="700" fill="#2e5f92" text-anchor="middle">contractuelles</text><rect x="1259.1764705882354" y="316" width="126.11764705882354" height="60" rx="20" fill="#d6e5f6" stroke="none" stroke-width="0"/><text x="1322.235294117647" y="342.5" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Client-</text><text x="1322.235294117647" y="359.3" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">fournisseur</text><rect x="1259.1764705882354" y="386" width="126.11764705882354" height="60" rx="20" fill="#d6e5f6" stroke="none" stroke-width="0"/><text x="1322.235294117647" y="412.5" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Usager-</text><text x="1322.235294117647" y="429.3" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">prestataire</text><rect x="1407.294117647059" y="258" width="114.3529411764706" height="296" rx="12" fill="#ffffff" stroke="#2e5f92" stroke-width="1.3"/><text x="1464.4705882352944" y="293.4" font-size="15.5" font-weight="700" fill="#2e5f92" text-anchor="middle">Religieuses</text><rect x="1417.294117647059" y="316" width="94.3529411764706" height="44" rx="20" fill="#f6ead0" stroke="none" stroke-width="0"/><text x="1464.4705882352944" y="342.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Religieuses</text><rect x="1533.6470588235295" y="258" width="114.3529411764706" height="296" rx="12" fill="#ffffff" stroke="#2e5f92" stroke-width="1.3"/><text x="1590.8235294117649" y="293.4" font-size="15.5" font-weight="700" fill="#2e5f92" text-anchor="middle">Artistiques</text><rect x="1543.6470588235295" y="316" width="94.3529411764706" height="44" rx="20" fill="#f5dde8" stroke="none" stroke-width="0"/><text x="1590.8235294117649" y="342.9" font-size="14" font-weight="400" fill="#1f2430" text-anchor="middle">Artistiques</text><rect x="1072" y="616" width="323.294117647059" height="56" rx="28" fill="#ece8f6" stroke="#5b4a8c" stroke-width="1.5"/><text x="1233.6470588235295" y="648.9" font-size="14" font-weight="700" fill="#5b4a8c" text-anchor="middle">Autorité du droit</text><line x1="1154.5882352941176" y1="612" x2="1154.5882352941176" y2="594" stroke="#5b4a8c" stroke-width="2"/><polygon points="1148.5882352941176,596 1160.5882352941176,596 1154.5882352941176,586" fill="#5b4a8c"/><line x1="1322.235294117647" y1="612" x2="1322.235294117647" y2="594" stroke="#5b4a8c" stroke-width="2"/><polygon points="1316.235294117647,596 1328.235294117647,596 1322.235294117647,586" fill="#5b4a8c"/><rect x="1407.294117647059" y="616" width="114.3529411764706" height="56" rx="28" fill="#f6ead0" stroke="#8a5d0c" stroke-width="1.5"/><text x="1464.4705882352944" y="639.8" font-size="14" font-weight="700" fill="#8a5d0c" text-anchor="middle">Autorité</text><text x="1464.4705882352944" y="658.0" font-size="14" font-weight="700" fill="#8a5d0c" text-anchor="middle">du sacré</text><line x1="1464.4705882352944" y1="612" x2="1464.4705882352944" y2="594" stroke="#8a5d0c" stroke-width="2"/><polygon points="1458.4705882352944,596 1470.4705882352944,596 1464.4705882352944,586" fill="#8a5d0c"/><rect x="1533.6470588235295" y="616" width="114.3529411764706" height="56" rx="28" fill="#f5dde8" stroke="#a33a6b" stroke-width="1.5"/><text x="1590.8235294117649" y="639.8" font-size="14" font-weight="700" fill="#a33a6b" text-anchor="middle">Autorité de</text><text x="1590.8235294117649" y="658.0" font-size="14" font-weight="700" fill="#a33a6b" text-anchor="middle">l’œuvre d’art</text><line x1="1590.8235294117649" y1="612" x2="1590.8235294117649" y2="594" stroke="#a33a6b" stroke-width="2"/><polygon points="1584.8235294117649,596 1596.8235294117649,596 1590.8235294117649,586" fill="#a33a6b"/><text x="1360.0" y="700.0" font-size="15" font-weight="600" fill="#5b4a8c" text-anchor="middle" font-style="italic">Ordre symbolique</text><text x="40" y="700.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="start">D’après M. Zacklad, typologie des configurations institutionnelles (version 9)</text></svg>