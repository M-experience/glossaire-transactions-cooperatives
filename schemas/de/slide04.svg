<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 580" width="1340" height="580" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="1340" height="580" fill="#ffffff"/><text xml:space="preserve" x="40" y="46.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Dieselbe Geste erhält ihre Bedeutung in der Konversationssituation</tspan></text><rect x="40" y="90" width="460" height="370" rx="12" fill="#fff" stroke="#c9c7bd" stroke-width="2"/><text xml:space="preserve" x="68" y="132.0" font-size="19" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Ebene 1 - Elementare Gesten</tspan></text><rect x="68" y="160" width="404" height="110" rx="12" fill="#fff" stroke="#c9c7bd" stroke-width="2"/><text xml:space="preserve" x="96" y="204.0" font-size="19" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Materielle Gesten</tspan></text><text xml:space="preserve" x="96" y="238.0" font-size="16" fill="#55606e" text-anchor="start"><tspan font-weight="400">Objekte und Milieu umgestalten</tspan></text><rect x="68" y="318" width="404" height="110" rx="12" fill="#fff" stroke="#c9c7bd" stroke-width="2"/><text xml:space="preserve" x="96" y="362.0" font-size="19" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Semiosische Gesten</tspan></text><text xml:space="preserve" x="96" y="396.0" font-size="16" fill="#55606e" text-anchor="start"><tspan font-weight="400">kodifizierte Formen hervorbringen</tspan></text><text xml:space="preserve" x="570" y="262.0" font-size="15" fill="#55606e" text-anchor="middle"><tspan font-weight="400">Interpretation</tspan></text><path d="M504,275 L636,275" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="90" width="660" height="370" rx="12" fill="#e5eef9" stroke="#2f7bd6" stroke-width="2.5"/><text xml:space="preserve" x="668" y="132.0" font-size="19" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Ebene 2 - Konversationelle Bedeutung</tspan></text><text xml:space="preserve" x="668" y="176.0" font-size="18" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Bedeutung, interpretiert nach:</tspan></text><text xml:space="preserve" x="668" y="220.0" font-size="16" fill="#1f2430" text-anchor="start"><tspan font-weight="400">• dem Kontext: den vorangehenden Gesten</tspan></text><text xml:space="preserve" x="668" y="261.6" font-size="16" fill="#1f2430" text-anchor="start"><tspan font-weight="400">• den vier Facetten der Bedeutung:</tspan></text><text xml:space="preserve" x="696" y="296.0" font-size="16" fill="#1f2430" text-anchor="start"><tspan font-weight="400">praxeologisch · narrativ</tspan></text><text xml:space="preserve" x="696" y="326.4" font-size="16" fill="#1f2430" text-anchor="start"><tspan font-weight="400">kognitiv · performativ</tspan></text><text xml:space="preserve" x="668" y="408.0" font-size="19" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Dies ist die Ebene der Kommunikation</tspan></text><text xml:space="preserve" x="40" y="520.0" font-size="16" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Beispiel: ein Werkzeug reichen kann Hilfe anbieten, ein Eingreifen erbitten oder eine Verantwortung übertragen.</tspan></text><text xml:space="preserve" x="40" y="556.8" font-size="16" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Beispiel: „ja“ kann annehmen, bestätigen, zustimmen, ironisieren oder nachgeben.</tspan></text></svg>