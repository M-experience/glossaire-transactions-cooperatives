<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 578" width="1600" height="578" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="1600" height="578" fill="#efece3"/><rect x="10" y="8" width="1580" height="562" rx="18" fill="#fff" stroke="none" stroke-width="0"/><text xml:space="preserve" x="62" y="78.0" font-size="27" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Die Geste ist stets flüchtig; das Artefakt dauert je nach der Natur seines Substrats</tspan></text><rect x="64" y="116" width="584" height="160" rx="14" fill="#e8f0fa" stroke="#2f6fbf" stroke-width="3"/><text xml:space="preserve" x="94" y="168.0" font-size="28" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Die Geste</tspan></text><text xml:space="preserve" x="94" y="212.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Stets flüchtig, gibt sie einem Substrat</tspan></text><text xml:space="preserve" x="94" y="245.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Form, hier und jetzt.</tspan></text><text xml:space="preserve" x="798" y="166.0" font-size="19" fill="#55606e" text-anchor="middle"><tspan font-weight="400">formt oder greift auf</tspan></text><text xml:space="preserve" x="798" y="202.0" font-size="30" fill="#55606e" text-anchor="middle"><tspan font-weight="400">⇄</tspan></text><text xml:space="preserve" x="798" y="245.0" font-size="19" fill="#55606e" text-anchor="middle"><tspan font-weight="400">wahrgenommen und angeeignet</tspan></text><rect x="950" y="116" width="584" height="160" rx="14" fill="#fdf1ec" stroke="#e06a3f" stroke-width="3"/><text xml:space="preserve" x="980" y="168.0" font-size="28" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Das vermittelnde Artefakt</tspan></text><text xml:space="preserve" x="980" y="212.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Das von der Geste geformte Substrat: flüchtig</tspan></text><text xml:space="preserve" x="980" y="245.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">oder dauerhaft je nach seiner Natur.</tspan></text><rect x="64" y="308" width="722" height="222" rx="10" fill="#f5f7fb" stroke="none" stroke-width="0"/><rect x="64" y="308" width="7" height="222" rx="3" fill="#2f6fbf"/><text xml:space="preserve" x="98" y="356.0" font-size="26" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Flüchtiges Substrat</tspan></text><text xml:space="preserve" x="98" y="398.0" font-size="22" fill="#55606e" text-anchor="start"><tspan font-weight="400">Die Luft für die Stimme, der Körper für die Mimik.</tspan></text><text xml:space="preserve" x="98" y="440.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Das Artefakt dauert nur so lange wie die Geste</tspan></text><text xml:space="preserve" x="98" y="471.9" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">und verschmilzt mit ihr in der Erfahrung.</tspan></text><rect x="814" y="308" width="722" height="222" rx="10" fill="#fdf7f3" stroke="none" stroke-width="0"/><rect x="814" y="308" width="7" height="222" rx="3" fill="#e06a3f"/><text xml:space="preserve" x="848" y="356.0" font-size="26" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Dauerhaftes Substrat</tspan></text><text xml:space="preserve" x="848" y="398.0" font-size="22" fill="#55606e" text-anchor="start"><tspan font-weight="400">Das Papier oder die digitale Datei, aber auch der Kuchen</tspan></text><text xml:space="preserve" x="848" y="429.9" font-size="22" fill="#55606e" text-anchor="start"><tspan font-weight="400">oder die Mahlzeit.</tspan></text><text xml:space="preserve" x="848" y="472.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Das Artefakt bewahrt die Form über den Augenblick hinaus:</tspan></text><text xml:space="preserve" x="848" y="503.9" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">es kann zirkulieren und wieder aufgegriffen werden.</tspan></text></svg>