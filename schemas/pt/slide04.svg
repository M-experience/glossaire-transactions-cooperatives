<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 580" width="1340" height="580" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="1340" height="580" fill="#ffffff"/><text xml:space="preserve" x="40" y="46.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="700">O mesmo gesto adquire sua significação na situação conversacional</tspan></text><rect x="40" y="90" width="460" height="370" rx="12" fill="#fff" stroke="#c9c7bd" stroke-width="2"/><text xml:space="preserve" x="68" y="132.0" font-size="19" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Nível 1 - Gestos elementares</tspan></text><rect x="68" y="160" width="404" height="110" rx="12" fill="#fff" stroke="#c9c7bd" stroke-width="2"/><text xml:space="preserve" x="96" y="204.0" font-size="19" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Gestos materiais</tspan></text><text xml:space="preserve" x="96" y="238.0" font-size="16" fill="#55606e" text-anchor="start"><tspan font-weight="400">transformar objetos e meio</tspan></text><rect x="68" y="318" width="404" height="110" rx="12" fill="#fff" stroke="#c9c7bd" stroke-width="2"/><text xml:space="preserve" x="96" y="362.0" font-size="19" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Gestos semiósicos</tspan></text><text xml:space="preserve" x="96" y="396.0" font-size="16" fill="#55606e" text-anchor="start"><tspan font-weight="400">produzir formas codificadas</tspan></text><text xml:space="preserve" x="570" y="262.0" font-size="15" fill="#55606e" text-anchor="middle"><tspan font-weight="400">interpretação</tspan></text><path d="M504,275 L636,275" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#a)"/><rect x="640" y="90" width="660" height="370" rx="12" fill="#e5eef9" stroke="#2f7bd6" stroke-width="2.5"/><text xml:space="preserve" x="668" y="132.0" font-size="19" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Nível 2 - Significação conversacional</tspan></text><text xml:space="preserve" x="668" y="176.0" font-size="18" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Significação interpretada segundo:</tspan></text><text xml:space="preserve" x="668" y="220.0" font-size="16" fill="#1f2430" text-anchor="start"><tspan font-weight="400">• o contexto: os gestos precedentes</tspan></text><text xml:space="preserve" x="668" y="261.6" font-size="16" fill="#1f2430" text-anchor="start"><tspan font-weight="400">• as quatro facetas da significação:</tspan></text><text xml:space="preserve" x="696" y="296.0" font-size="16" fill="#1f2430" text-anchor="start"><tspan font-weight="400">praxeológica · narrativa</tspan></text><text xml:space="preserve" x="696" y="326.4" font-size="16" fill="#1f2430" text-anchor="start"><tspan font-weight="400">cognitiva · performativa</tspan></text><text xml:space="preserve" x="668" y="408.0" font-size="19" fill="#1f2430" text-anchor="start"><tspan font-weight="700">É o nível da comunicação</tspan></text><text xml:space="preserve" x="40" y="520.0" font-size="16" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Exemplo: estender uma ferramenta pode oferecer ajuda, pedir uma intervenção ou transmitir uma responsabilidade.</tspan></text><text xml:space="preserve" x="40" y="556.8" font-size="16" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Exemplo: “sim” pode aceitar, confirmar, aquiescer, ironizar ou ceder.</tspan></text></svg>