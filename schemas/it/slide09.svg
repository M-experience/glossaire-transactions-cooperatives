<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 545" width="1600" height="545" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="1600" height="545" fill="#faf8f3"/><rect x="10" y="14" width="776" height="212" rx="14" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/><text xml:space="preserve" x="44" y="68.0" font-size="29" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Finalità</tspan></text><text xml:space="preserve" x="44" y="116.0" font-size="24" fill="#2e5f92" text-anchor="start"><tspan font-weight="700">abilitante ↔ portatore di valore</tspan></text><text xml:space="preserve" x="44" y="160.0" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">L’opera è l’artefatto portatore di valore.</tspan></text><rect x="812" y="14" width="776" height="212" rx="14" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/><text xml:space="preserve" x="846" y="68.0" font-size="29" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Simbolicità</tspan></text><text xml:space="preserve" x="846" y="116.0" font-size="24" fill="#2e5f92" text-anchor="start"><tspan font-weight="700">profano ↔ simbolico</tspan></text><text xml:space="preserve" x="846" y="160.0" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Dal profano, nel senso di Durkheim, a ciò che</tspan></text><text xml:space="preserve" x="846" y="194.5" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">il rito riattualizza.</tspan></text><rect x="10" y="250" width="776" height="212" rx="14" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/><text xml:space="preserve" x="44" y="304.0" font-size="29" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Perennità</tspan></text><text xml:space="preserve" x="44" y="352.0" font-size="24" fill="#c8102e" text-anchor="start"><tspan font-weight="700">effimero ↔ perenne</tspan></text><text xml:space="preserve" x="44" y="396.0" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Secondo il substrato: la voce scompare con il gesto,</tspan></text><text xml:space="preserve" x="44" y="430.5" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">il documento o la torta gli sopravvivono.</tspan></text><rect x="812" y="250" width="776" height="212" rx="14" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/><text xml:space="preserve" x="846" y="304.0" font-size="29" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Materialità</tspan></text><text xml:space="preserve" x="846" y="352.0" font-size="24" fill="#c8102e" text-anchor="start"><tspan font-weight="700">materiale ↔ semiosico</tspan></text><text xml:space="preserve" x="846" y="396.0" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Agisce mediante la forza, o mediante l’interpretazione</tspan></text><text xml:space="preserve" x="846" y="430.5" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">di un segno.</tspan></text><text xml:space="preserve" x="10" y="524.0" font-size="24" fill="#1f2430" text-anchor="start"><tspan font-weight="700">In blu</tspan><tspan font-weight="400">, la dinamica del valore. </tspan><tspan font-weight="700">In rosso</tspan><tspan font-weight="400">, il modo di esistenza dell’artefatto, legato direttamente ai gesti.</tspan></text></svg>