<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 994" width="1700" height="994" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="1700" height="994" fill="#ffffff"/><text x="40" y="56.0" font-size="28" font-weight="700" fill="#1f2430" text-anchor="start">Les trois modes de coordination dans la STC</text><text x="40" y="86.0" font-size="17" font-weight="400" fill="#55606e" text-anchor="start">Trois modes, neuf formes, un dispositif conversationnel</text><rect x="40" y="108" width="1620" height="34" rx="8" fill="#efece6" stroke="none" stroke-width="0"/><text x="850" y="130.2" font-size="15" font-weight="600" fill="#55606e" text-anchor="middle">Coordination : règle l’accès, les rôles réciproques et la lecture partagée de la situation</text><rect x="40" y="164" width="510" height="516" rx="16" fill="#f0f6e8" stroke="#4f7a28" stroke-width="2"/><text x="295.0" y="194.0" font-size="12.5" font-weight="700" fill="#4f7a28" text-anchor="middle" letter-spacing="1.5">MILIEU · TERRITORIALISATION</text><text x="295.0" y="224.8" font-size="21" font-weight="700" fill="#4f7a28" text-anchor="middle">Coordination par l’accès</text><text x="295.0" y="249.9" font-size="21" font-weight="700" fill="#4f7a28" text-anchor="middle">spatio-temporel</text><text x="295.0" y="280.0" font-size="13.5" font-weight="400" fill="#55606e" text-anchor="middle">Critère des formes : partage du lieu et du temps</text><rect x="52" y="296" width="486" height="92" rx="12" fill="#ffffff" stroke="#dcebc9" stroke-width="2"/><text x="295.0" y="320.0" font-size="12.5" font-weight="600" fill="#4f7a28" text-anchor="middle" font-style="italic">Même lieu, même temps</text><text x="295.0" y="348.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle">Synchrone en présence</text><text x="295.0" y="372.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">face-à-face, réunion</text><rect x="52" y="400" width="486" height="92" rx="12" fill="#ffffff" stroke="#dcebc9" stroke-width="2"/><text x="295.0" y="424.0" font-size="12.5" font-weight="600" fill="#4f7a28" text-anchor="middle" font-style="italic">Même temps, sans partage du lieu</text><text x="295.0" y="452.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle">Synchrone à distance</text><text x="295.0" y="476.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">téléphone, visiophonie, direct</text><rect x="52" y="504" width="486" height="92" rx="12" fill="#ffffff" stroke="#dcebc9" stroke-width="2"/><text x="295.0" y="528.0" font-size="12.5" font-weight="600" fill="#4f7a28" text-anchor="middle" font-style="italic">Échange différé</text><text x="295.0" y="556.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle">Asynchrone</text><text x="295.0" y="580.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">textes, documents, messages, archives</text><rect x="595" y="164" width="510" height="516" rx="16" fill="#fbeeee" stroke="#b0413e" stroke-width="2"/><text x="850.0" y="194.0" font-size="12.5" font-weight="700" fill="#b0413e" text-anchor="middle" letter-spacing="1.5">SELFS · SUBJECTIVATION</text><text x="850.0" y="224.8" font-size="21" font-weight="700" fill="#b0413e" text-anchor="middle">Coordination</text><text x="850.0" y="249.9" font-size="21" font-weight="700" fill="#b0413e" text-anchor="middle">relationnelle</text><text x="850.0" y="280.0" font-size="13.5" font-weight="400" fill="#55606e" text-anchor="middle">Critère des formes : qui peut tenir le rôle</text><rect x="607" y="296" width="486" height="92" rx="12" fill="#ffffff" stroke="#f6dcdc" stroke-width="2"/><text x="850.0" y="320.0" font-size="12.5" font-weight="600" fill="#b0413e" text-anchor="middle" font-style="italic">Cette personne-ci</text><text x="850.0" y="348.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle">Interpersonnelle</text><text x="850.0" y="372.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">couple, amis intimes, parent et enfant</text><rect x="607" y="400" width="486" height="92" rx="12" fill="#ffffff" stroke="#f6dcdc" stroke-width="2"/><text x="850.0" y="424.0" font-size="12.5" font-weight="600" fill="#b0413e" text-anchor="middle" font-style="italic">Un membre du collectif</text><text x="850.0" y="452.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle">Affiliative</text><text x="850.0" y="476.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">équipe, association, leader reconnu</text><rect x="607" y="504" width="486" height="92" rx="12" fill="#ffffff" stroke="#f6dcdc" stroke-width="2"/><text x="850.0" y="528.0" font-size="12.5" font-weight="600" fill="#b0413e" text-anchor="middle" font-style="italic">Quiconque remplit les conditions</text><text x="850.0" y="556.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle">Positionnelle</text><text x="850.0" y="580.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">client et fournisseur, usager et agent</text><defs><linearGradient id="aut" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a3330"/><stop offset="0.5" stop-color="#d79d9a"/><stop offset="1" stop-color="#f8e6e5"/></linearGradient></defs><rect x="607" y="610" width="486" height="46" rx="23" fill="url(#aut)" stroke="#b0413e" stroke-width="1.2"/><text x="625" y="639.0" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">hiérarchie</text><text x="850.0" y="630.0" font-size="12.5" font-weight="700" fill="#5a1f1d" text-anchor="middle">Gradient d’autorité</text><text x="850.0" y="647.0" font-size="12.5" font-weight="600" fill="#5a1f1d" text-anchor="middle">hétérarchie</text><text x="1075" y="639.0" font-size="13" font-weight="700" fill="#8a3330" text-anchor="end">parité</text><rect x="1150" y="164" width="510" height="516" rx="16" fill="#edf3fb" stroke="#2e5f92" stroke-width="2"/><text x="1405.0" y="194.0" font-size="12.5" font-weight="700" fill="#2e5f92" text-anchor="middle" letter-spacing="1.5">ARTEFACTS MÉDIATEURS</text><text x="1405.0" y="224.8" font-size="21" font-weight="700" fill="#2e5f92" text-anchor="middle">Coordination</text><text x="1405.0" y="249.9" font-size="21" font-weight="700" fill="#2e5f92" text-anchor="middle">interprétative</text><text x="1405.0" y="280.0" font-size="13.5" font-weight="400" fill="#55606e" text-anchor="middle">Critère des formes : registre de la sémiose cognitive</text><rect x="1162" y="296" width="486" height="92" rx="12" fill="#ffffff" stroke="#d6e5f6" stroke-width="2"/><text x="1405.0" y="320.0" font-size="12.5" font-weight="600" fill="#2e5f92" text-anchor="middle" font-style="italic">Raison sensible</text><text x="1405.0" y="348.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle">Conscience mutuelle</text><text x="1405.0" y="372.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">signaux, regards, rythme (awareness)</text><rect x="1162" y="400" width="486" height="92" rx="12" fill="#ffffff" stroke="#d6e5f6" stroke-width="2"/><text x="1405.0" y="424.0" font-size="12.5" font-weight="600" fill="#2e5f92" text-anchor="middle" font-style="italic">Raison pratique</text><text x="1405.0" y="452.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle">Typification</text><text x="1405.0" y="476.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">routines, check-lists, livrables</text><rect x="1162" y="504" width="486" height="92" rx="12" fill="#ffffff" stroke="#d6e5f6" stroke-width="2"/><text x="1405.0" y="528.0" font-size="12.5" font-weight="600" fill="#2e5f92" text-anchor="middle" font-style="italic">Raison conceptuelle</text><text x="1405.0" y="556.0" font-size="18" font-weight="700" fill="#1f2430" text-anchor="middle">Conceptualisation</text><text x="1405.0" y="580.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">modèles, spécifications, récits</text><rect x="40" y="730" width="1620" height="186" rx="16" fill="#f4f2fa" stroke="#5b4a8c" stroke-width="2"/><text x="70" y="762.0" font-size="19" font-weight="700" fill="#5b4a8c" text-anchor="start">Dispositif conversationnel</text><text x="330" y="762.0" font-size="14" font-weight="400" fill="#55606e" text-anchor="start">coordination stabilisée qui cadre les conversations, en position de tiers médiateur</text><line x1="295.0" y1="684" x2="295.0" y2="721" stroke="#5b4a8c" stroke-width="2"/><polygon points="289.0,720 301.0,720 295.0,730" fill="#5b4a8c"/><text x="305.0" y="708.0" font-size="12" font-weight="600" fill="#5b4a8c" text-anchor="start" font-style="italic">cadrage</text><rect x="52" y="790" width="486" height="108" rx="12" fill="#ffffff" stroke="#c9c1e3" stroke-width="1.5"/><text x="295.0" y="822.0" font-size="17" font-weight="700" fill="#5b4a8c" text-anchor="middle">Dispositif d’accès</text><text x="295.0" y="850.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">lieux et salles, agendas, visiophonie,</text><text x="295.0" y="868.2" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">messageries, plateformes, espaces documentaires</text><line x1="850.0" y1="684" x2="850.0" y2="721" stroke="#5b4a8c" stroke-width="2"/><polygon points="844.0,720 856.0,720 850.0,730" fill="#5b4a8c"/><text x="860.0" y="708.0" font-size="12" font-weight="600" fill="#5b4a8c" text-anchor="start" font-style="italic">cadrage</text><rect x="607" y="790" width="486" height="108" rx="12" fill="#ffffff" stroke="#c9c1e3" stroke-width="1.5"/><text x="850.0" y="822.0" font-size="17" font-weight="700" fill="#5b4a8c" text-anchor="middle">Dispositif relationnel</text><text x="850.0" y="850.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">organigrammes, fiches de poste, contrats,</text><text x="850.0" y="868.2" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">statuts, délégations, règles d’appartenance</text><line x1="1405.0" y1="684" x2="1405.0" y2="721" stroke="#5b4a8c" stroke-width="2"/><polygon points="1399.0,720 1411.0,720 1405.0,730" fill="#5b4a8c"/><text x="1415.0" y="708.0" font-size="12" font-weight="600" fill="#5b4a8c" text-anchor="start" font-style="italic">cadrage</text><rect x="1162" y="790" width="486" height="108" rx="12" fill="#ffffff" stroke="#c9c1e3" stroke-width="1.5"/><text x="1405.0" y="822.0" font-size="17" font-weight="700" fill="#5b4a8c" text-anchor="middle">Dispositif interprétatif</text><text x="1405.0" y="850.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">procédures, référentiels, spécifications,</text><text x="1405.0" y="868.2" font-size="13" font-weight="400" fill="#55606e" text-anchor="middle">tableaux de bord, maquettes, prototypes</text><text x="40" y="950.0" font-size="14" font-weight="400" fill="#1f2430" text-anchor="start">Dans chaque mode, les formes ne s’excluent pas ; les trois modes se combinent dans toute situation de coordination.</text><text x="40" y="974.0" font-size="13" font-weight="400" fill="#55606e" text-anchor="start">D’après M. Zacklad, Les trois modes de coordination dans la STC (2026)</text></svg>