<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 578" width="1600" height="578" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="1600" height="578" fill="#efece3"/><rect x="10" y="8" width="1580" height="562" rx="18" fill="#fff" stroke="none" stroke-width="0"/><text xml:space="preserve" x="62" y="78.0" font-size="27" fill="#1f2430" text-anchor="start"><tspan font-weight="700">El gesto es siempre efímero; el artefacto dura según la naturaleza de su sustrato</tspan></text><rect x="64" y="116" width="584" height="160" rx="14" fill="#e8f0fa" stroke="#2f6fbf" stroke-width="3"/><text xml:space="preserve" x="94" y="168.0" font-size="28" fill="#1f2430" text-anchor="start"><tspan font-weight="700">El gesto</tspan></text><text xml:space="preserve" x="94" y="212.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Siempre efímero, da forma a un</tspan></text><text xml:space="preserve" x="94" y="245.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">sustrato, aquí y ahora.</tspan></text><text xml:space="preserve" x="798" y="166.0" font-size="19" fill="#55606e" text-anchor="middle"><tspan font-weight="400">da forma o retoma</tspan></text><text xml:space="preserve" x="798" y="202.0" font-size="30" fill="#55606e" text-anchor="middle"><tspan font-weight="400">⇄</tspan></text><text xml:space="preserve" x="798" y="245.0" font-size="19" fill="#55606e" text-anchor="middle"><tspan font-weight="400">es percibido y apropiado</tspan></text><rect x="950" y="116" width="584" height="160" rx="14" fill="#fdf1ec" stroke="#e06a3f" stroke-width="3"/><text xml:space="preserve" x="980" y="168.0" font-size="28" fill="#1f2430" text-anchor="start"><tspan font-weight="700">El artefacto mediador</tspan></text><text xml:space="preserve" x="980" y="212.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">El sustrato formado por el gesto: efímero</tspan></text><text xml:space="preserve" x="980" y="245.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">o perenne según su naturaleza.</tspan></text><rect x="64" y="308" width="722" height="222" rx="10" fill="#f5f7fb" stroke="none" stroke-width="0"/><rect x="64" y="308" width="7" height="222" rx="3" fill="#2f6fbf"/><text xml:space="preserve" x="98" y="356.0" font-size="26" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Sustrato efímero</tspan></text><text xml:space="preserve" x="98" y="398.0" font-size="22" fill="#55606e" text-anchor="start"><tspan font-weight="400">El aire para la voz, el cuerpo para la mímica.</tspan></text><text xml:space="preserve" x="98" y="440.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">El artefacto solo dura lo que el gesto y se</tspan></text><text xml:space="preserve" x="98" y="471.9" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">confunde con él en la experiencia.</tspan></text><rect x="814" y="308" width="722" height="222" rx="10" fill="#fdf7f3" stroke="none" stroke-width="0"/><rect x="814" y="308" width="7" height="222" rx="3" fill="#e06a3f"/><text xml:space="preserve" x="848" y="356.0" font-size="26" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Sustrato perenne</tspan></text><text xml:space="preserve" x="848" y="398.0" font-size="22" fill="#55606e" text-anchor="start"><tspan font-weight="400">El papel o el archivo digital, pero también el pastel o</tspan></text><text xml:space="preserve" x="848" y="429.9" font-size="22" fill="#55606e" text-anchor="start"><tspan font-weight="400">la comida.</tspan></text><text xml:space="preserve" x="848" y="472.0" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">El artefacto conserva la forma más allá del instante: puede</tspan></text><text xml:space="preserve" x="848" y="503.9" font-size="22" fill="#1f2430" text-anchor="start"><tspan font-weight="400">circular y ser retomado.</tspan></text></svg>