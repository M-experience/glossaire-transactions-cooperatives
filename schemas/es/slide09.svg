<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 545" width="1600" height="545" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="1600" height="545" fill="#faf8f3"/><rect x="10" y="14" width="776" height="212" rx="14" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/><text xml:space="preserve" x="44" y="68.0" font-size="29" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Finalidad</tspan></text><text xml:space="preserve" x="44" y="116.0" font-size="24" fill="#2e5f92" text-anchor="start"><tspan font-weight="700">capacitante ↔ portador de valor</tspan></text><text xml:space="preserve" x="44" y="160.0" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">La obra es el artefacto portador de valor.</tspan></text><rect x="812" y="14" width="776" height="212" rx="14" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/><text xml:space="preserve" x="846" y="68.0" font-size="29" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Simbolicidad</tspan></text><text xml:space="preserve" x="846" y="116.0" font-size="24" fill="#2e5f92" text-anchor="start"><tspan font-weight="700">profano ↔ simbólico</tspan></text><text xml:space="preserve" x="846" y="160.0" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">De lo profano, en el sentido de Durkheim, a lo que</tspan></text><text xml:space="preserve" x="846" y="194.5" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">el ritual reactualiza.</tspan></text><rect x="10" y="250" width="776" height="212" rx="14" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/><text xml:space="preserve" x="44" y="304.0" font-size="29" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Perennidad</tspan></text><text xml:space="preserve" x="44" y="352.0" font-size="24" fill="#c8102e" text-anchor="start"><tspan font-weight="700">efímero ↔ perenne</tspan></text><text xml:space="preserve" x="44" y="396.0" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Según el sustrato: la voz desaparece con el gesto,</tspan></text><text xml:space="preserve" x="44" y="430.5" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">el documento o el pastel le sobreviven.</tspan></text><rect x="812" y="250" width="776" height="212" rx="14" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/><text xml:space="preserve" x="846" y="304.0" font-size="29" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Materialidad</tspan></text><text xml:space="preserve" x="846" y="352.0" font-size="24" fill="#c8102e" text-anchor="start"><tspan font-weight="700">material ↔ semiósico</tspan></text><text xml:space="preserve" x="846" y="396.0" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Actúa por la fuerza, o por la interpretación</tspan></text><text xml:space="preserve" x="846" y="430.5" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">de un signo.</tspan></text><text xml:space="preserve" x="10" y="524.0" font-size="24" fill="#1f2430" text-anchor="start"><tspan font-weight="700">En azul</tspan><tspan font-weight="400">, la dinámica del valor. </tspan><tspan font-weight="700">En rojo</tspan><tspan font-weight="400">, el modo de existencia del artefacto, ligado directamente a los gestos.</tspan></text></svg>