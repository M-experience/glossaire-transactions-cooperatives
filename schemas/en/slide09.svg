<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 545" width="1600" height="545" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker></defs><rect width="1600" height="545" fill="#faf8f3"/><rect x="10" y="14" width="776" height="212" rx="14" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/><text xml:space="preserve" x="44" y="68.0" font-size="29" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Finality</tspan></text><text xml:space="preserve" x="44" y="116.0" font-size="24" fill="#2e5f92" text-anchor="start"><tspan font-weight="700">enabling ↔ value-bearing</tspan></text><text xml:space="preserve" x="44" y="160.0" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">The work is the value-bearing artifact.</tspan></text><rect x="812" y="14" width="776" height="212" rx="14" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/><text xml:space="preserve" x="846" y="68.0" font-size="29" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Symbolicity</tspan></text><text xml:space="preserve" x="846" y="116.0" font-size="24" fill="#2e5f92" text-anchor="start"><tspan font-weight="700">profane ↔ symbolic</tspan></text><text xml:space="preserve" x="846" y="160.0" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">From the profane, in Durkheim’s sense, to what</tspan></text><text xml:space="preserve" x="846" y="194.5" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">ritual reactualizes.</tspan></text><rect x="10" y="250" width="776" height="212" rx="14" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/><text xml:space="preserve" x="44" y="304.0" font-size="29" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Persistence</tspan></text><text xml:space="preserve" x="44" y="352.0" font-size="24" fill="#c8102e" text-anchor="start"><tspan font-weight="700">ephemeral ↔ persistent</tspan></text><text xml:space="preserve" x="44" y="396.0" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Depends on the substrate: the voice vanishes with</tspan></text><text xml:space="preserve" x="44" y="430.5" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">the gesture, the document or the cake outlive it.</tspan></text><rect x="812" y="250" width="776" height="212" rx="14" fill="#fff" stroke="#e6e2d8" stroke-width="1.5"/><text xml:space="preserve" x="846" y="304.0" font-size="29" fill="#1f2430" text-anchor="start"><tspan font-weight="700">Materiality</tspan></text><text xml:space="preserve" x="846" y="352.0" font-size="24" fill="#c8102e" text-anchor="start"><tspan font-weight="700">material ↔ semiosic</tspan></text><text xml:space="preserve" x="846" y="396.0" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">Acts through force, or through the interpretation</tspan></text><text xml:space="preserve" x="846" y="430.5" font-size="23" fill="#1f2430" text-anchor="start"><tspan font-weight="400">of a sign.</tspan></text><text xml:space="preserve" x="10" y="524.0" font-size="24" fill="#1f2430" text-anchor="start"><tspan font-weight="700" fill="#2e5f92">In blue</tspan><tspan font-weight="400">, value dynamics. </tspan><tspan font-weight="700" fill="#c8102e">In red</tspan><tspan font-weight="400">, the artifact’s mode of existence, directly linked to gestures.</tspan></text></svg>