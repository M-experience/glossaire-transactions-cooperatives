eight="700">Performance</tspan></text><rect x="537" y="233" width="192" height="170" rx="12" fill="#e5eef9" stroke="#2f7bd6" stroke-width="2.5"/><text xml:space="preserve" x="633" y="276.0" font-size="20" fill="#1f2430" text-anchor="middle"><tspan font-weight="700">Realization</tspan></text><text xml:space="preserve" x="633" y="318.0" font-size="18" fill="#1f2430" text-anchor="middle"><tspan font-weight="400">consummatory</tspan></text><text xml:space="preserve" x="633" y="349.5" font-size="18" fill="#1f2430" text-anchor="middle"><tspan font-weight="400">(performer)</tspan></text><rect x="742" y="233" width="192" height="170" rx="12" fill="#e5eef9" stroke="#2f7bd6" stroke-width="2.5"/><text xml:space="preserve" x="838" y="276.0" font-size="20" fill="#1f2430" text-anchor="middle"><tspan font-weight="700">Reception</tspan></text><text xml:space="preserve" x="838" y="318.0" font-size="18" fill="#1f2430" text-anchor="middle"><tspan font-weight="400">consummatory</tspan></text><text xml:space="preserve" x="838" y="349.5" font-size="18" fill="#1f2430" text-anchor="middle"><tspan font-weight="400">(beneficiary)</tspan></text><rect x="976" y="178" width="326" height="246" rx="12" fill="#fff" stroke="#c9c7bd" stroke-width="2"/><text xml:space="preserve" x="1139" y="214.0" font-size="20" fill="#1f2430" text-anchor="middle"><tspan font-weight="700">Review</tspan></text><rect x="990" y="230" width="298" height="82" rx="12" fill="#fff" stroke="#c9c7bd" stroke-width="2"/><text xml:space="preserve" x="1139" y="278.0" font-size="20" fill="#1f2430" text-anchor="middle"><tspan font-weight="700">Evaluation</tspan></text><rect x="990" y="325" width="298" height="82" rx="12" fill="#fff" stroke="#c9c7bd" stroke-width="2"/><text xml:space="preserve" x="1139" y="373.0" font-size="20" fill="#1f2430" text-anchor="middle"><tspan font-weight="700">Retribution</tspan></text><path d="M256,300 L280,300" fill="none" stroke="#c9c7bd" stroke-width="2" marker-end="url(#a)"/><path d="M497,300 L520,300